[versions]
kotlin = "2.4.21"
spring-boot = "4.0.6"
spring-dependencyManagement = "1.1.7"
ktor = "3.6.0"
dgsBom = "12.1.0"
dgsCodegen = "8.7.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationBom = "1.11.0"
gcloud-firestore = "3.49.0"
detekt = "2.0.0-alpha.6"
graalvmNative = "1.1.13"
caffeine = "3.3.0"
okhttp = "5.5.0"
ksoup = "0.2.6"
commonsText = "1.15.0"
develocity = "4.6.0"
toolchainsResolver = "1.0.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-powerAssert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
kotlin-noArg = { id = "org.jetbrains.kotlin.plugin.noarg", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependencyManagement" }
dgsCodegen = { id = "com.netflix.dgs.codegen", version.ref = "dgsCodegen" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
graalvmNative = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }

[libraries]
detektKtlintWrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt"}
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-graphql-test = { module = "org.springframework.boot:spring-boot-starter-graphql-test" }
spring-test = { module = "org.springframework:spring-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
testcontainers-gcloud = { module = "org.testcontainers:testcontainers-gcloud" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-serialization-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml", version.ref = "ktor" }
dgs-bom = { module = "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies", version.ref = "dgsBom" }
dgs-starter = { module = "com.netflix.graphql.dgs:dgs-starter"}
gcloud-firestore = { module = "com.google.cloud:google-cloud-firestore", version.ref = "gcloud-firestore" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "kotlinxSerializationBom" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
commonsText = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }
